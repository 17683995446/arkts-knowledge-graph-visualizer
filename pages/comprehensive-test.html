<script>
'use strict';
// ============================================================
// 全链路日志追踪器
// ============================================================
const Logger = {
    _logs: [],
    _startTime: Date.now(),
    _indent: 0,
    _logEl: null,
    init() { this._logEl = document.getElementById('logOut'); },
    _ts() { return '[' + (Date.now() - this._startTime) + 'ms]'; },
    entry(fn) {
        this._indent++;
        const prefix = '  '.repeat(this._indent - 1) + '→';
        this._raw(this._ts() + ' ' + prefix + ' ENTER ' + fn);
    },
    exit(fn, duration) {
        const prefix = '  '.repeat(this._indent - 1) + '←';
        this._raw(this._ts() + ' ' + prefix + ' EXIT  ' + fn + ' (' + duration + 'ms)');
        this._indent = Math.max(0, this._indent - 1);
    },
    info(msg) {
        const prefix = '  '.repeat(this._indent) + 'ℹ';
        this._raw(this._ts() + ' ' + prefix + ' ' + msg);
    },
    warn(msg) {
        const prefix = '  '.repeat(this._indent) + '⚠';
        this._raw(this._ts() + ' ' + prefix + ' WARN: ' + msg);
    },
    error(msg) {
        const prefix = '  '.repeat(this._indent) + '✖';
        this._raw(this._ts() + ' ' + prefix + ' ERROR: ' + msg);
    },
    ok(msg) {
        const prefix = '  '.repeat(this._indent) + '✅';
        this._raw(this._ts() + ' ' + prefix + ' ' + msg);
    },
    fail(msg) {
        const prefix = '  '.repeat(this._indent) + '❌';
        this._raw(this._ts() + ' ' + prefix + ' ' + msg);
    },
    section(title) {
        this._raw('\n' + '='.repeat(60));
        this._raw('  ' + title);
        this._raw('='.repeat(60));
    },
    _raw(text) {
        this._logs.push(text);
        if (this._logEl) this._logEl.textContent = this._logs.join('\n');
    }
};
Logger.init();

// ============================================================
// 测试框架（增强版，带计时）
// ============================================================
const T = {
    results: [],
    _sectionStart: 0,
    _totalStart: Date.now(),
    section(name) {
        Logger.section(name);
        this._sectionStart = Date.now();
    },
    endSection() {
        const dur = Date.now() - this._sectionStart;
        Logger.info('模块耗时: ' + dur + 'ms');
    },
    assert(cond, name, detail) {
        const r = { pass: !!cond, name: name, detail: detail || '', time: Date.now() - this._totalStart };
        this.results.push(r);
        if (cond) { Logger.ok(name); } else { Logger.fail(name + (detail ? ' — ' + detail : '')); }
        this._updateUI();
        return cond;
    },
    assertNoThrow(fn, name) {
        const t0 = performance.now();
        try { fn(); const dur = (performance.now() - t0).toFixed(1); return this.assert(true, name, dur + 'ms'); }
        catch(e) { const dur = (performance.now() - t0).toFixed(1); return this.assert(false, name, '异常: ' + e.message + ' (' + dur + 'ms)'); }
    },
    assertThrow(fn, name) {
        try { fn(); return this.assert(false, name, '未抛出异常'); }
        catch(e) { return this.assert(true, name); }
    },
    _updateUI() {
        const total = this.results.length;
        const pass = this.results.filter(r => r.pass).length;
        const fail = total - pass;
        document.getElementById('st').textContent = total;
        document.getElementById('sp').textContent = pass;
        document.getElementById('sf').textContent = fail;
        document.getElementById('sm').textContent = (Date.now() - this._totalStart) + 'ms';
        document.getElementById('pf').style.width = (total > 0 ? (pass / total * 100) : 0) + '%';
        const c = document.getElementById('results');
        c.innerHTML = '';
        this.results.forEach(r => {
            const d = document.createElement('div');
            d.className = 'tr ' + (r.pass ? 'p' : 'f');
            const icon = document.createElement('span');
            icon.textContent = r.pass ? '✅' : '❌';
            d.appendChild(icon);
            const nm = document.createElement('span');
            nm.textContent = r.name;
            d.appendChild(nm);
            if (r.detail) {
                const dt = document.createElement('span');
                dt.className = 'd';
                dt.textContent = r.detail;
                d.appendChild(dt);
            }
            c.appendChild(d);
        });
    }
};

// ============================================================
// 辅助函数
// ============================================================
function makeDiv(id, w, h) {
    const d = document.createElement('div');
    d.id = id;
    d.style.cssText = 'width:' + w + 'px;height:' + h + 'px;position:absolute;left:-9999px;top:-9999px;';
    document.body.appendChild(d);
    return d;
}
function removeDiv(id) { const d = document.getElementById(id); if (d) d.remove(); }
function genNodes(n) {
    const nodes = [];
    for (let i = 0; i < n; i++) nodes.push({ id: i, label: 'N' + i, group: ['component','utility','interface','model','service','enum'][i % 6], size: 5 + Math.random() * 25 });
    return nodes;
}
function genEdges(n, maxId) {
    const edges = [];
    for (let i = 0; i < n; i++) edges.push({ from: Math.floor(Math.random() * maxId), to: Math.floor(Math.random() * maxId), label: 'dep' });
    return edges;
}
function genTreeData(depth, breadth) {
    function build(d, prefix) {
        if (d <= 0) return { name: prefix, value: Math.floor(Math.random() * 100) + 1 };
        const children = [];
        const b = d === depth ? breadth : Math.max(2, breadth - 1);
        for (let i = 0; i < b; i++) children.push(build(d - 1, prefix + '/' + i));
        return { name: prefix, children: children };
    }
    return build(depth, 'root');
}

// ============================================================
// 1. 数据完整性验证
// ============================================================
function testDataIntegrity() {
    T.section('1. 数据完整性验证');
    Logger.entry('testDataIntegrity');
    
    T.assert(KGData !== undefined, 'KGData: 全局对象存在');
    T.assert(KGData !== null, 'KGData: 不为null');
    
    // overview
    T.assert(KGData.overview !== undefined, 'KGData.overview: 存在');
    T.assert(typeof KGData.overview.totalFiles === 'number', 'overview.totalFiles: 是数字');
    T.assert(KGData.overview.totalFiles > 0, 'overview.totalFiles: > 0');
    
    // projectStructure
    T.assert(Array.isArray(KGData.projectStructure.nodes), 'projectStructure.nodes: 是数组');
    T.assert(KGData.projectStructure.nodes.length === 29, 'projectStructure.nodes: 29个节点');
    T.assert(Array.isArray(KGData.projectStructure.edges), 'projectStructure.edges: 是数组');
    T.assert(KGData.projectStructure.edges.length === 30, 'projectStructure.edges: 30条边');
    
    // 验证边引用的节点存在
    const psIds = new Set(KGData.projectStructure.nodes.map(n => n.id));
    let psValid = true;
    for (const e of KGData.projectStructure.edges) {
        if (!psIds.has(e.from) || !psIds.has(e.to)) { psValid = false; Logger.warn('无效边: ' + e.from + '->' + e.to); break; }
    }
    T.assert(psValid, 'projectStructure: 所有边引用有效');
    
    // classHierarchy
    T.assert(Array.isArray(KGData.classHierarchy.nodes), 'classHierarchy.nodes: 是数组');
    T.assert(KGData.classHierarchy.nodes.length === 16, 'classHierarchy.nodes: 16个节点');
    T.assert(Array.isArray(KGData.classHierarchy.edges), 'classHierarchy.edges: 是数组');
    
    // functionCalls
    T.assert(Array.isArray(KGData.functionCalls.nodes), 'functionCalls.nodes: 是数组');
    T.assert(Array.isArray(KGData.functionCalls.edges), 'functionCalls.edges: 是数组');
    
    // moduleDeps
    T.assert(Array.isArray(KGData.moduleDeps.modules), 'moduleDeps.modules: 是数组');
    T.assert(KGData.moduleDeps.modules.length === 10, 'moduleDeps.modules: 10个模块');
    T.assert(Array.isArray(KGData.moduleDeps.dependencies), 'moduleDeps.dependencies: 是数组');
    
    // fileTypes, codeTrend
    T.assert(Array.isArray(KGData.fileTypes) && KGData.fileTypes.length > 0, 'fileTypes: 非空数组');
    T.assert(Array.isArray(KGData.codeTrend) && KGData.codeTrend.length > 0, 'codeTrend: 非空数组');
    
    // codeStats
    T.assert(KGData.codeStats !== undefined, 'codeStats: 存在');
    T.assert(KGData.codeStats.complexity !== undefined, 'codeStats.complexity: 存在');
    T.assert(typeof KGData.codeStats.complexity.low === 'number', 'complexity.low: 是数字');
    
    // fileStructure (嵌套树)
    T.assert(KGData.fileStructure !== undefined, 'fileStructure: 存在');
    T.assert(KGData.fileStructure.name !== undefined, 'fileStructure.name: 有name');
    
    // queryHistory
    T.assert(Array.isArray(KGData.queryHistory), 'queryHistory: 是数组');
    
    // searchResults
    T.assert(KGData.searchResults !== undefined, 'searchResults: 存在');
    T.assert(Array.isArray(KGData.searchResults.classes), 'searchResults.classes: 是数组');
    T.assert(Array.isArray(KGData.searchResults.functions), 'searchResults.functions: 是数组');
    
    Logger.exit('testDataIntegrity');
    T.endSection();
}

// ============================================================
// 2. GraphVisualizer 单元测试
// ============================================================
function testGraphVisualizer() {
    T.section('2. GraphVisualizer 单元测试');
    Logger.entry('testGraphVisualizer');
    
    // 构造函数
    Logger.info('测试构造函数...');
    T.assertNoThrow(() => new GraphVisualizer('nonexistent'), '构造: 不存在的容器不崩溃');
    const div = makeDiv('gv-test', 800, 600);
    const gv = new GraphVisualizer('gv-test');
    T.assert(gv !== null, '构造: 返回实例');
    T.assert(gv.network === null, '构造: network初始为null');
    
    // init
    Logger.info('测试init()...');
    const net = gv.init(KGData.projectStructure.nodes, KGData.projectStructure.edges);
    T.assert(net !== null, 'init: 返回network实例');
    T.assert(gv.network !== null, 'init: this.network已设置');
    
    // Bug #71: XSS防护 - label中的HTML标签不应执行
    Logger.info('测试XSS防护(Bug#71)...');
    const xssDiv = makeDiv('gv-xss', 400, 300);
    const gvXss = new GraphVisualizer('gv-xss');
    T.assertNoThrow(() => {
        gvXss.init([{ id: 'x1', label: '<b>bold</b>' }, { id: 'x2', label: '&lt;script&gt;' }], []);
    }, 'init: HTML标签label不崩溃(Bug#71)');
    gvXss.destroy();
    removeDiv('gv-xss');
    
    // null安全
    Logger.info('测试null安全...');
    T.assertNoThrow(() => gv.focusNode(null), 'focusNode: null不崩溃');
    T.assertNoThrow(() => gv.focusNode('nonexistent-id-99999'), 'focusNode: 不存在的ID不崩溃');
    T.assertNoThrow(() => gv.fit(), 'fit: 无参数不崩溃');
    T.assertNoThrow(() => gv.togglePhysics(), 'togglePhysics: 切换不崩溃');
    T.assertNoThrow(() => gv.highlightConnected(null), 'highlightConnected: null不崩溃');
    T.assertNoThrow(() => gv.highlightConnected('nonexistent'), 'highlightConnected: 不存在ID不崩溃');
    T.assertNoThrow(() => gv.resetHighlight(), 'resetHighlight: 不崩溃');
    T.assertNoThrow(() => gv.searchNodes(''), 'searchNodes: 空字符串不崩溃');
    T.assertNoThrow(() => gv.searchNodes('Entry'), 'searchNodes: 正常搜索不崩溃');
    T.assertNoThrow(() => gv.exportImage(), 'exportImage: 不崩溃');
    
    // Bug #56: highlightConnected使用Set
    Logger.info('测试highlightConnected Set优化(Bug#56)...');
    if (KGData.projectStructure.nodes.length > 0) {
        const firstId = KGData.projectStructure.nodes[0].id;
        T.assertNoThrow(() => { gv.highlightConnected(firstId); gv.resetHighlight(); }, 'highlightConnected: 正常节点Set查找');
    }
    
    // destroy
    Logger.info('测试destroy()...');
    T.assertNoThrow(() => gv.destroy(), 'destroy: 不崩溃');
    T.assert(gv.network === null, 'destroy: network已清空');
    
    removeDiv('gv-test');
    Logger.exit('testGraphVisualizer');
    T.endSection();
}

// ============================================================
// 5. ChartManager 单元测试
// ============================================================
function testChartManager() {
    T.section('5. ChartManager 单元测试');
    Logger.entry('testChartManager');
    
    const div = makeDiv('cm-test', 600, 400);
    const cm = new ChartManager();
    
    // 容器不存在
    Logger.info('测试容器null安全...');
    T.assertNoThrow(() => cm.createPieChart('no-such-div', []), 'createPieChart: 不存在的容器');
    T.assertNoThrow(() => cm.createLineChart('no-such-div', []), 'createLineChart: 不存在的容器');
    T.assertNoThrow(() => cm.createBarChart('no-such-div', []), 'createBarChart: 不存在的容器');
    T.assertNoThrow(() => cm.createForceGraph('no-such-div', [], []), 'createForceGraph: 不存在的容器');
    T.assertNoThrow(() => cm.createChordDiagram('no-such-div', []), 'createChordDiagram: 不存在的容器');
    T.assertNoThrow(() => cm.createTreemap('no-such-div', []), 'createTreemap: 不存在的容器');
    
    // 正常数据
    Logger.info('测试正常数据...');
    const pieData = KGData.fileTypes;
    T.assertNoThrow(() => cm.createPieChart('cm-test', pieData), 'createPieChart: fileTypes数据');
    
    const lineData = KGData.codeTrend;
    T.assertNoThrow(() => cm.createLineChart('cm-test', lineData), 'createLineChart: codeTrend数据');
    
    const barData = KGData.codeStats.languages;
    T.assertNoThrow(() => cm.createBarChart('cm-test', barData), 'createBarChart: languages数据');
    
    const forceNodes = KGData.projectStructure.nodes.slice(0, 10);
    const forceEdges = KGData.projectStructure.edges.slice(0, 8);
    T.assertNoThrow(() => cm.createForceGraph('cm-test', forceNodes, forceEdges), 'createForceGraph: 子集数据');
    
    // Bug #75修复: createChordDiagram需要二维方阵+labels，不能直接传dependencies对象数组
    // 测试1: 传入无效数据应安全返回（不崩溃）
    T.assertNoThrow(() => cm.createChordDiagram('cm-test', KGData.moduleDeps.dependencies.slice(0, 5)), 'createChordDiagram: 无效数据安全返回');
    // 测试2: 传入正确的矩阵格式
    const chordMatrix = [
        [0, 10, 5, 8],
        [10, 0, 7, 3],
        [5, 7, 0, 12],
        [8, 3, 12, 0]
    ];
    const chordLabels = ['App', 'Components', 'Services', 'Utils'];
    T.assertNoThrow(() => cm.createChordDiagram('cm-test', chordMatrix, chordLabels), 'createChordDiagram: 正确矩阵数据');
    
    T.assertNoThrow(() => cm.createTreemap('cm-test', [{ name: 'root', children: [{ name: 'a', value: 10 }, { name: 'b', value: 20 }] }]), 'createTreemap: 简单树');
    
    // 空数据
    Logger.info('测试空数据...');
    T.assertNoThrow(() => cm.createPieChart('cm-test', []), 'createPieChart: 空数组');
    T.assertNoThrow(() => cm.createLineChart('cm-test', []), 'createLineChart: 空数组');
    T.assertNoThrow(() => cm.createBarChart('cm-test', []), 'createBarChart: 空数组');
    
    // 单元素
    Logger.info('测试单元素...');
    T.assertNoThrow(() => cm.createPieChart('cm-test', [{ name: 'A', value: 1 }]), 'createPieChart: 单元素');
    T.assertNoThrow(() => cm.createLineChart('cm-test', [{ date: 'x', lines: 100 }]), 'createLineChart: 单元素');
    
    // Bug #65: 所有值相同
    Logger.info('测试所有值相同(Bug#65)...');
    const flatLine = [{ date: 'a', lines: 100 }, { date: 'b', lines: 100 }, { date: 'c', lines: 100 }];
    T.assertNoThrow(() => cm.createLineChart('cm-test', flatLine), 'createLineChart: 所有值相同不崩溃');
    
    // 异常值
    Logger.info('测试异常值...');
    T.assertNoThrow(() => cm.createPieChart('cm-test', [{ name: 'A', value: 0 }]), 'createPieChart: 零值');
    T.assertNoThrow(() => cm.createPieChart('cm-test', [{ name: 'A', value: -1 }]), 'createPieChart: 负值');
    T.assertNoThrow(() => cm.createPieChart('cm-test', [{ name: 'A', value: NaN }]), 'createPieChart: NaN值');
    T.assertNoThrow(() => cm.createLineChart('cm-test', [{ date: 'x', lines: NaN }]), 'createLineChart: NaN值');
    T.assertNoThrow(() => cm.createPieChart('cm-test', [{ name: 'A', value: Infinity }]), 'createPieChart: Infinity值');
    
    // ForceGraph destroy
    Logger.info('测试ForceGraph destroy...');
    const fg = cm.createForceGraph('cm-test', [{ id: 'a' }, { id: 'b' }], [{ from: 'a', to: 'b' }]);
    if (fg && fg.destroy) T.assertNoThrow(() => fg.destroy(), 'ForceGraph.destroy: 不崩溃');
    
    removeDiv('cm-test');
    Logger.exit('testChartManager');
    T.endSection();
}

// ============================================================
// 6. main.js 全局函数测试
// ============================================================
function testMainFunctions() {

// ============================================================
// 12. 安全测试
// ============================================================
function testSecurity() {
    T.section('12. 安全测试');
    Logger.entry('testSecurity');
    
    // XSS payload测试
    // Bug #76修复: escapeHtml使用textContent方式，只转义<>和&，不转义引号
    // XSS防护核心是确保HTML标签被转义，而非转义所有特殊字符
    Logger.info('测试XSS payload转义...');
    const xssTests = [
        { input: '<b>bold</b>', expected: '&lt;b&gt;bold&lt;/b&gt;' },
        { input: '<img src=x onerror=alert(1)>', check: '<img' },  // 标签被转义
        { input: '<svg onload=alert(1)>', check: '<svg' },          // 标签被转义
        { input: '<a href="javascript:alert(1)">', check: '<a' },    // 标签被转义
        { input: '"><script>', check: '<script>' },                 // 标签被转义
        { input: "'-alert(1)-'", expected: "'-alert(1)-'" },        // 无HTML标签，原样返回
        { input: '{{constructor.constructor("alert(1)")()}}', expected: '{{constructor.constructor("alert(1)")()}}' }  // 无HTML标签，原样返回
    ];
    
    xssTests.forEach(t => {
        const escaped = escapeHtml(t.input);
        if (t.expected) {
            T.assert(escaped === t.expected, 'XSS: "' + t.input.substring(0, 30) + '" 精确匹配');
        } else if (t.check) {
            T.assert(!escaped.includes(t.check), 'XSS: "' + t.input.substring(0, 30) + '" 不含 ' + t.check);
        }
    });
    
    // SQL注入转义测试
    // Bug #76修复: 修复测试逻辑 - replace(/'/g, "''")后检查每个原始单引号都被双写
    Logger.info('测试SQL注入转义...');
    const sqlPayloads = [
        "'; DROP TABLE functions; --",
        "1' OR '1'='1",
        "'; INSERT INTO admin VALUES ('h', 'p'); --"
    ];
    sqlPayloads.forEach(p => {
        const escaped = p.replace(/'/g, "''");
        // 正确的检查: 转义后不应存在单独的'后面跟非'的字符（即原始单引号都被双写了）
        // 简单检查: 转义后字符串长度 = 原始长度 + 原始单引号数量
        const origSingleQuoteCount = (p.match(/'/g) || []).length;
        const escapedSingleQuoteCount = (escaped.match(/'/g) || []).length;
        T.assert(escapedSingleQuoteCount === origSingleQuoteCount * 2,
            'SQL: "' + p.substring(0, 25) + '" 单引号被双写转义');
    });
    
    // CSV转义测试
    Logger.info('测试CSV转义...');
    const csvVal = 'value with "quotes" and,commas';
    const csvEscaped = '"' + csvVal.replace(/"/g, '""') + '"';
    T.assert(csvEscaped.startsWith('"') && csvEscaped.endsWith('"'), 'CSV: 值被双引号包裹');
    T.assert(!csvEscaped.includes('value with "quotes"'), 'CSV: 内部双引号被转义');
    
    Logger.exit('testSecurity');
    T.endSection();
}

    T.assert(net !== null, '集成: 项目结构图初始化成功');
    
    // 2. 搜索
    Logger.info('步骤2: 搜索节点...');
    gv.searchNodes('Entry');
    gv.resetHighlight();
    
    // 3. 高亮连接
    Logger.info('步骤3: 高亮连接...');
    if (KGData.projectStructure.nodes.length > 0) {
        gv.highlightConnected(KGData.projectStructure.nodes[0].id);
        gv.resetHighlight();
    }
    
    // 4. 切换物理引擎
    Logger.info('步骤4: 切换物理引擎...');
    gv.togglePhysics();
    gv.togglePhysics();
    
    // 5. 创建图表
    Logger.info('步骤5: 创建统计图表...');
    const cm = new ChartManager();
    cm.createPieChart('int-cm', KGData.fileTypes);
    cm.createLineChart('int-cm', KGData.codeTrend);
    cm.createBarChart('int-cm', KGData.codeStats.languages);
    
    // 6. 创建树形图
    Logger.info('步骤6: 创建文件结构树...');
    const tv = new TreeVisualizer('int-tv');
    tv.init(KGData.fileStructure);
    tv.expandAll();
    tv.collapseAll();
    
    // 7. 创建旭日图
    Logger.info('步骤7: 创建旭日图...');
    const sv = new SunburstVisualizer('int-sv');
    sv.init(KGData.fileStructure);
    
    // 8. 清理
    Logger.info('步骤8: 清理所有组件...');
    T.assertNoThrow(() => { gv.destroy(); tv.destroy(); sv.destroy(); }, '集成: 所有组件destroy');
    
    removeDiv('int-gv');
    removeDiv('int-cm');
    removeDiv('int-tv');
    removeDiv('int-sv');
    
    Logger.ok('全链路集成测试通过');
    Logger.exit('testFullIntegration');
    T.endSection();
}

// ============================================================
// 运行所有测试
// ============================================================
function runAllTests() {
    Logger.info('🚀 开始大规模综合自动化测试...');
    Logger.info('测试框架版本: v2.0');
    Logger.info('测试时间: ' + new Date().toISOString());
    
    const suites = [
        testDataIntegrity,
        testGraphVisualizer,
        testTreeVisualizer,
        testSunburstVisualizer,
        testChartManager,
        testMainFunctions,
        testStressLargeData,
        testMemoryLeaks,
        testChaoticScenarios,
        testDataBoundaries,
        testConcurrency,
        testSecurity,
        testFullIntegration
    ];
    
    let failedSuites = 0;
    suites.forEach(fn => {
        try { fn(); }
        catch(e) {
            Logger.error('测试套件崩溃: ' + e.message + '\n' + e.stack);
            failedSuites++;
        }
    });
    
    // 汇总
    const total = T.results.length;
    const pass = T.results.filter(r => r.pass).length;
    const fail = total - pass;
    
    Logger.info('');
    Logger.info('═'.repeat(60));
    Logger.info('  测试完成汇总');
    Logger.info('═'.repeat(60));
    Logger.info('  总测试: ' + total);
    Logger.info('  通过:   ' + pass);
    Logger.info('  失败:   ' + fail);
    Logger.info('  崩溃套件: ' + failedSuites);
    Logger.info('  总耗时: ' + (Date.now() - T._totalStart) + 'ms');
    Logger.info('═'.repeat(60));
    
    if (fail > 0) {
        Logger.warn('失败的测试:');
        T.results.filter(r => !r.pass).forEach(r => {
            Logger.fail('  ✗ ' + r.name + (r.detail ? ' — ' + r.detail : ''));
            console.error('TEST_FAIL: ' + r.name + (r.detail ? ' — ' + r.detail : ''));
        });
    }
    console.log('TEST_SUMMARY: total=' + total + ' pass=' + pass + ' fail=' + fail + ' crashedSuites=' + failedSuites + ' time=' + (Date.now() - T._totalStart) + 'ms');
    
    // 自动滚动日志到底部
    if (Logger._logEl) Logger._logEl.scrollTop = Logger._logEl.scrollHeight;
}

// 自动运行
runAllTests();
</script>
